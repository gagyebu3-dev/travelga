<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2F5233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="여행경비 가계부">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<title>여행경비 가계부</title>
<style>
  :root{
    --bg:#EFEBE0;
    --surface:#FFFFFF;
    --surface-2:#F7F4EA;
    --ink:#1F2A22;
    --ink-soft:#5B6459;
    --line:#DCD5C3;
    --primary:#2F5233;
    --primary-ink:#EAF1EA;
    --accent:#C08A2E;
    --income:#3E7C59;
    --expense:#B5533C;
    --shadow:0 1px 2px rgba(31,42,34,.06), 0 4px 14px rgba(31,42,34,.07);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
    min-height:100vh;
  }
  .display{font-family:Georgia,"Noto Serif KR",serif;}
  header.top{
    padding:22px 20px 16px;
    background:var(--primary);
    color:var(--primary-ink);
    border-radius:0 0 22px 22px;
  }
  header.top .brand{
    font-size:13px;
    letter-spacing:.02em;
    opacity:.75;
    margin:0 0 6px;
  }
  .month-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .month-row .month{
    font-size:22px;
    font-weight:600;
  }
  .month-row button{
    background:rgba(255,255,255,.14);
    border:none;color:var(--primary-ink);
    width:34px;height:34px;border-radius:50%;
    font-size:16px;cursor:pointer;
  }
  .summary{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  }
  .summary .cell .label{font-size:12px;opacity:.75;margin-bottom:4px;}
  .summary .cell .value{font-size:16px;font-weight:700;}
  .summary .cell.balance .value{font-size:19px;}

  main{padding:16px;max-width:520px;margin:0 auto;}

  .day-group{margin-bottom:18px;}
  .day-heading{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:var(--ink-soft);
    padding:0 4px 8px;
  }
  .day-heading .dow{margin-left:4px;}
  .day-total{font-size:12px;}

  .tx-item{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px 14px;
    display:flex;align-items:center;gap:12px;
    margin-bottom:8px;
  }
  .tx-badge{
    width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  }
  .tx-mid{flex:1;min-width:0;}
  .tx-cat{font-size:14px;font-weight:600;}
  .tx-memo{font-size:12.5px;color:var(--ink-soft);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-amount{font-size:15px;font-weight:700;white-space:nowrap;}
  .tx-amount.income{color:var(--income);}
  .tx-amount.expense{color:var(--expense);}
  .tx-item{cursor:pointer;}

  .empty-state{
    text-align:center;color:var(--ink-soft);
    padding:60px 20px;
    font-size:14px;line-height:1.6;
  }

  .fab{
    position:fixed;right:20px;bottom:88px;
    width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;
    font-size:28px;line-height:56px;text-align:center;
    box-shadow:0 6px 16px rgba(192,138,46,.45);
    cursor:pointer;z-index:20;
  }

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 0 max(8px, env(safe-area-inset-bottom));
    z-index:19;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-size:11px;cursor:pointer;padding:4px 0;
  }
  nav.tabbar button .ic{font-size:19px;}
  nav.tabbar button.active{color:var(--primary);font-weight:700;}

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(31,42,34,.42);
    display:none;align-items:flex-end;justify-content:center;z-index:30;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%;max-width:520px;
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
  }
  .sheet h2{margin:2px 0 16px;font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:15px;background:var(--surface-2);
    color:var(--ink);font-family:inherit;
  }
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;}
  .seg button{
    flex:1;border:none;background:none;padding:9px 0;border-radius:8px;
    font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .seg button.on.expense{background:var(--expense);color:#fff;}
  .seg button.on.income{background:var(--income);color:#fff;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:8px 13px;border-radius:20px;font-size:13.5px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    cursor:pointer;
  }
  .chip.on{border-color:transparent;color:#fff;}
  .amount-input{font-size:22px !important;font-weight:700;text-align:right;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn{
    flex:1;border:none;border-radius:12px;padding:13px;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--primary);color:#fff;}
  .btn.ghost{background:var(--surface-2);color:var(--ink);}
  .btn.danger{background:none;color:var(--expense);}

  .page{display:none;}
  .page.active{display:block;}

  .stat-card{
    background:var(--surface);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px;
  }
  .stat-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .stat-toggle button{
    border:1px solid var(--line);background:var(--surface-2);
    border-radius:20px;padding:7px 16px;font-size:13px;cursor:pointer;color:var(--ink-soft);
  }
  .stat-toggle button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .legend-row{
    display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .legend-name{flex:1;font-size:14px;}
  .legend-pct{font-size:12.5px;color:var(--ink-soft);width:42px;text-align:right;}
  .legend-amt{font-size:14px;font-weight:700;width:98px;text-align:right;}

  .backup-btn{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:12px;cursor:pointer;border:none;width:100%;
    font-size:14.5px;color:var(--ink);text-align:left;font-family:inherit;
  }
  .backup-btn .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .backup-btn .arrow{color:var(--ink-soft);}
  .section-title{font-size:13px;color:var(--ink-soft);margin:20px 4px 8px;}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13.5px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top">
  <p class="brand">여행경비 가계부</p>
  <div class="month-row">
    <button id="prevMonth">‹</button>
    <div class="month display" id="monthLabel">2026년 9월</div>
    <button id="nextMonth">›</button>
  </div>
  <div class="summary">
    <div class="cell"><div class="label">수입</div><div class="value" id="sumIncome">0원</div></div>
    <div class="cell"><div class="label">지출</div><div class="value" id="sumExpense">0원</div></div>
    <div class="cell balance"><div class="label">잔액</div><div class="value" id="sumBalance">0원</div></div>
  </div>
</header>

<main>
  <div class="page active" id="page-home">
    <div id="txList"></div>
  </div>

  <div class="page" id="page-stats">
    <div class="stat-card">
      <div class="stat-toggle">
        <button class="on" data-t="expense">지출</button>
        <button data-t="income">수입</button>
      </div>
      <svg id="donut" viewBox="0 0 200 200" width="100%" style="max-width:220px;display:block;margin:0 auto 18px;"></svg>
      <div id="legendBox"></div>
    </div>
  </div>

  <div class="page" id="page-backup">
    <p class="section-title">내보내기</p>
    <button class="backup-btn" id="exportJson">
      <div><div>JSON 파일로 내보내기</div><div class="sub">전체 데이터를 그대로 백업</div></div>
      <div class="arrow">›</div>
    </button>
    <button class="backup-btn" id="exportCsv">
      <div><div>엑셀(CSV)로 내보내기</div><div class="sub">엑셀·스프레드시트에서 열람용</div></div>
      <div class="arrow">›</div>
    </button>
    <p class="section-title">가져오기</p>
    <button class="backup-btn" id="importJsonBtn">
      <div><div>JSON 파일 가져오기</div><div class="sub">백업 파일로 데이터 복원</div></div>
      <div class="arrow">›</div>
    </button>
    <input type="file" id="importJsonFile" accept="application/json" style="display:none;">
    <p class="section-title">기타</p>
    <button class="backup-btn" id="clearAll">
      <div><div style="color:var(--expense);">전체 데이터 삭제</div><div class="sub">모든 거래 내역을 삭제합니다</div></div>
      <div class="arrow">›</div>
    </button>
  </div>
</main>

<button class="fab" id="fabAdd">+</button>

<nav class="tabbar">
  <button class="tab active" data-page="home"><span class="ic">⌂</span>홈</button>
  <button class="tab" data-page="stats"><span class="ic">◔</span>통계</button>
  <button class="tab" data-page="backup"><span class="ic">⇅</span>백업</button>
</nav>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <h2 id="sheetTitle">거래 추가</h2>
    <div class="seg" id="typeSeg">
      <button data-type="expense" class="on expense">지출</button>
      <button data-type="income">수입</button>
    </div>
    <div class="field" style="margin-top:14px;">
      <label>금액</label>
      <input type="text" inputmode="numeric" id="fAmount" class="amount-input" placeholder="0">
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="chips" id="catChips"></div>
    </div>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <input type="text" id="fMemo" placeholder="메모를 입력하세요">
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="deleteBtn" style="display:none;">삭제</button>
      <button class="btn ghost" id="cancelBtn">취소</button>
      <button class="btn primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "salrim_ledger_v1";
  var CATS = {
    expense: [
      {n:"식비", c:"#B5533C"}, {n:"카페/간식", c:"#C97B4A"}, {n:"교통", c:"#6B8F71"},
      {n:"쇼핑", c:"#A98B4E"}, {n:"문화/여가", c:"#7C6A46"}, {n:"주거/공과금", c:"#5C7A99"},
      {n:"통신", c:"#8B5E3C"}, {n:"의료/건강", c:"#9C7A9A"}, {n:"교육", c:"#4F6D5A"},
      {n:"경조사", c:"#C08A2E"}, {n:"기타", c:"#8A8272"}
    ],
    income: [
      {n:"급여", c:"#2F5233"}, {n:"용돈", c:"#3E7C59"}, {n:"부수입", c:"#6B8F71"},
      {n:"이자/투자", c:"#4F6D5A"}, {n:"기타", c:"#8A8272"}
    ]
  };

  var state = {
    txs: [],
    cursor: new Date(),
    formType: "expense",
    formCat: null,
    editingId: null,
    statType: "expense"
  };

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      state.txs = raw ? JSON.parse(raw) : [];
    }catch(e){ state.txs = []; }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.txs));
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmt(n){ return Number(n||0).toLocaleString("ko-KR") + "원"; }
  function catColor(type, name){
    var list = CATS[type] || [];
    for (var i=0;i<list.length;i++) if(list[i].n===name) return list[i].c;
    return "#8A8272";
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  // ---------- Rendering: header/month ----------
  function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
  function renderHeader(){
    document.getElementById("monthLabel").textContent =
      state.cursor.getFullYear() + "년 " + (state.cursor.getMonth()+1) + "월";
    var mk = monthKey(state.cursor);
    var monthTxs = state.txs.filter(function(t){ return t.date.slice(0,7)===mk; });
    var inc=0, exp=0;
    monthTxs.forEach(function(t){ if(t.type==="income") inc+=t.amount; else exp+=t.amount; });
    document.getElementById("sumIncome").textContent = fmt(inc);
    document.getElementById("sumExpense").textContent = fmt(exp);
    document.getElementById("sumBalance").textContent = fmt(inc-exp);
    return monthTxs;
  }

  var DOWS = ["일","월","화","수","목","금","토"];
  function renderList(){
    var monthTxs = renderHeader();
    var byDate = {};
    monthTxs.forEach(function(t){
      (byDate[t.date] = byDate[t.date] || []).push(t);
    });
    var dates = Object.keys(byDate).sort().reverse();
    var box = document.getElementById("txList");
    box.innerHTML = "";
    if(dates.length===0){
      box.innerHTML = '<div class="empty-state">이번 달 거래 내역이 없습니다.<br>오른쪽 아래 + 버튼으로 추가해보세요.</div>';
      return;
    }
    dates.forEach(function(dt){
      var items = byDate[dt].sort(function(a,b){ return b.createdAt-a.createdAt; });
      var dayInc=0, dayExp=0;
      items.forEach(function(t){ if(t.type==="income") dayInc+=t.amount; else dayExp+=t.amount; });
      var d = new Date(dt+"T00:00:00");
      var group = document.createElement("div");
      group.className = "day-group";
      var heading = document.createElement("div");
      heading.className = "day-heading";
      heading.innerHTML =
        '<span>' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 <span class="dow">(' + DOWS[d.getDay()] + ')</span></span>' +
        '<span class="day-total">' + (dayInc? '+'+fmt(dayInc)+' ' : '') + (dayExp? '-'+fmt(dayExp):'') + '</span>';
      group.appendChild(heading);
      items.forEach(function(t){
        var el = document.createElement("div");
        el.className = "tx-item";
        el.innerHTML =
          '<span class="tx-badge" style="background:' + catColor(t.type,t.category) + '"></span>' +
          '<span class="tx-mid"><div class="tx-cat">' + escapeHtml(t.category) + '</div>' +
          (t.memo? '<div class="tx-memo">'+escapeHtml(t.memo)+'</div>' : '') + '</span>' +
          '<span class="tx-amount ' + t.type + '">' + (t.type==="income"?"+":"-") + fmt(t.amount) + '</span>';
        el.addEventListener("click", function(){ openSheet(t); });
        group.appendChild(el);
      });
      box.appendChild(group);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------- Add/Edit sheet ----------
  var overlay = document.getElementById("sheetOverlay");
  function renderChips(){
    var box = document.getElementById("catChips");
    box.innerHTML = "";
    CATS[state.formType].forEach(function(cat){
      var chip = document.createElement("div");
      chip.className = "chip" + (state.formCat===cat.n ? " on":"");
      chip.textContent = cat.n;
      if(state.formCat===cat.n){ chip.style.background = cat.c; }
      chip.addEventListener("click", function(){
        state.formCat = cat.n;
        renderChips();
      });
      box.appendChild(chip);
    });
  }
  function setFormType(type){
    state.formType = type;
    state.formCat = null;
    document.querySelectorAll("#typeSeg button").forEach(function(b){
      var on = b.dataset.type===type;
      b.classList.toggle("on", on);
      b.classList.toggle(type, on);
    });
    renderChips();
  }
  document.querySelectorAll("#typeSeg button").forEach(function(b){
    b.addEventListener("click", function(){ setFormType(b.dataset.type); });
  });
  document.getElementById("fAmount").addEventListener("input", function(e){
    var digits = e.target.value.replace(/[^0-9]/g,"");
    e.target.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
  });

  function openSheet(tx){
    state.editingId = tx ? tx.id : null;
    document.getElementById("sheetTitle").textContent = tx ? "거래 수정" : "거래 추가";
    document.getElementById("deleteBtn").style.display = tx ? "block" : "none";
    setFormType(tx ? tx.type : "expense");
    state.formCat = tx ? tx.category : null;
    renderChips();
    document.getElementById("fAmount").value = tx ? Number(tx.amount).toLocaleString("ko-KR") : "";
    document.getElementById("fDate").value = tx ? tx.date : new Date().toISOString().slice(0,10);
    document.getElementById("fMemo").value = tx ? (tx.memo||"") : "";
    overlay.classList.add("open");
  }
  function closeSheet(){ overlay.classList.remove("open"); }
  document.getElementById("fabAdd").addEventListener("click", function(){ openSheet(null); });
  document.getElementById("cancelBtn").addEventListener("click", closeSheet);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeSheet(); });

  document.getElementById("saveBtn").addEventListener("click", function(){
    var amtRaw = document.getElementById("fAmount").value.replace(/[^0-9]/g,"");
    var amount = Number(amtRaw);
    var date = document.getElementById("fDate").value;
    var memo = document.getElementById("fMemo").value.trim();
    if(!amount){ toast("금액을 입력해주세요"); return; }
    if(!state.formCat){ toast("카테고리를 선택해주세요"); return; }
    if(!date){ toast("날짜를 선택해주세요"); return; }
    if(state.editingId){
      var t = state.txs.find(function(x){ return x.id===state.editingId; });
      t.type=state.formType; t.category=state.formCat; t.amount=amount; t.date=date; t.memo=memo;
    } else {
      state.txs.push({
        id: uid(), type: state.formType, category: state.formCat,
        amount: amount, date: date, memo: memo, createdAt: Date.now()
      });
    }
    save(); closeSheet(); renderList(); renderStats();
    toast("저장되었습니다");
  });
  document.getElementById("deleteBtn").addEventListener("click", function(){
    if(!state.editingId) return;
    state.txs = state.txs.filter(function(x){ return x.id!==state.editingId; });
    save(); closeSheet(); renderList(); renderStats();
    toast("삭제되었습니다");
  });

  // ---------- Month nav ----------
  document.getElementById("prevMonth").addEventListener("click", function(){
    state.cursor.setMonth(state.cursor.getMonth()-1);
    renderList(); renderStats();
  });
  document.getElementById("nextMonth").addEventListener("click", function(){
    state.cursor.setMonth(state.cursor.getMonth()+1);
    renderList(); renderStats();
  });

  // ---------- Tabs ----------
  document.querySelectorAll("nav.tabbar .tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll("nav.tabbar .tab").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
      document.getElementById("page-"+btn.dataset.page).classList.add("active");
      if(btn.dataset.page==="stats") renderStats();
    });
  });

  // ---------- Stats ----------
  document.querySelectorAll(".stat-toggle button").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".stat-toggle button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      state.statType = b.dataset.t;
      renderStats();
    });
  });
  function renderStats(){
    var mk = monthKey(state.cursor);
    var type = state.statType;
    var monthTxs = state.txs.filter(function(t){ return t.date.slice(0,7)===mk && t.type===type; });
    var totals = {};
    var grand = 0;
    monthTxs.forEach(function(t){
      totals[t.category] = (totals[t.category]||0) + t.amount;
      grand += t.amount;
    });
    var cats = Object.keys(totals).sort(function(a,b){ return totals[b]-totals[a]; });
    var svg = document.getElementById("donut");
    var legend = document.getElementById("legendBox");
    if(cats.length===0){
      svg.innerHTML = '<circle cx="100" cy="100" r="80" fill="none" stroke="#E4DFCF" stroke-width="26"/>';
      legend.innerHTML = '<div class="empty-state" style="padding:10px 0;">데이터가 없습니다.</div>';
      return;
    }
    var r = 80, cx=100, cy=100, circ = 2*Math.PI*r, offset = 0;
    var arcs = "";
    cats.forEach(function(name){
      var frac = totals[name]/grand;
      var len = frac*circ;
      arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+catColor(type,name)+'" ' +
        'stroke-width="26" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      offset += len;
    });
    svg.innerHTML = arcs + '<text x="100" y="96" text-anchor="middle" font-size="13" fill="#5B6459">합계</text>' +
      '<text x="100" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2A22">'+fmt(grand)+'</text>';
    legend.innerHTML = "";
    cats.forEach(function(name){
      var row = document.createElement("div");
      row.className = "legend-row";
      var pct = Math.round(totals[name]/grand*100);
      row.innerHTML =
        '<span class="legend-dot" style="background:'+catColor(type,name)+'"></span>' +
        '<span class="legend-name">'+escapeHtml(name)+'</span>' +
        '<span class="legend-pct">'+pct+'%</span>' +
        '<span class="legend-amt">'+fmt(totals[name])+'</span>';
      legend.appendChild(row);
    });
  }

  // ---------- Backup ----------
  function download(filename, content, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  }
  document.getElementById("exportJson").addEventListener("click", function(){
    download("여행경비 가계부_백업_"+new Date().toISOString().slice(0,10)+".json",
      JSON.stringify({exportedAt:new Date().toISOString(), transactions: state.txs}, null, 2),
      "application/json");
    toast("JSON 파일을 저장했습니다");
  });
  document.getElementById("exportCsv").addEventListener("click", function(){
    var rows = [["날짜","구분","카테고리","금액","메모"]];
    state.txs.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(t){
      rows.push([t.date, t.type==="income"?"수입":"지출", t.category, t.amount, (t.memo||"").replace(/"/g,'""')]);
    });
    var csv = "\uFEFF" + rows.map(function(r){
      return r.map(function(c){ return '"'+String(c)+'"'; }).join(",");
    }).join("\r\n");
    download("여행경비 가계부_"+new Date().toISOString().slice(0,10)+".csv", csv, "text/csv;charset=utf-8");
    toast("CSV 파일을 저장했습니다");
  });
  document.getElementById("importJsonBtn").addEventListener("click", function(){
    document.getElementById("importJsonFile").click();
  });
  document.getElementById("importJsonFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var list = Array.isArray(data) ? data : data.transactions;
        if(!Array.isArray(list)) throw new Error("invalid");
        list.forEach(function(t){ if(!t.id) t.id = uid(); if(!t.createdAt) t.createdAt = Date.now(); });
        state.txs = list;
        save(); renderList(); renderStats();
        toast("가져오기가 완료되었습니다");
      }catch(err){
        toast("파일을 읽을 수 없습니다");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });
  document.getElementById("clearAll").addEventListener("click", function(){
    if(confirm("모든 거래 내역을 삭제할까요? 이 작업은 되돌릴 수 없습니다.")){
      state.txs = [];
      save(); renderList(); renderStats();
      toast("모든 데이터를 삭제했습니다");
    }
  });

  // ---------- init ----------
  load();
  setFormType("expense");
  renderList();
  renderStats();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./service-worker.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
